<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Three stacked layers in isometric perspective -->
  <!-- Layer 1 (top) — solid fill, the main layer -->
  <path d="M256 64L448 160L256 256L64 160Z" fill="#3A8BFD"/>
  
  <!-- Layer 2 — outline, medium opacity -->
  <path d="M64 224L256 320L448 224" stroke="#3A8BFD" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Layer 3 — outline in coral -->
  <path d="M64 300L256 396L448 300" stroke="#FB923C" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Layer 4 — subtle, lowest -->
  <path d="M64 376L256 472L448 376" stroke="#FB923C" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
</svg>